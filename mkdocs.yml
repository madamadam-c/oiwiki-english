# Project Information
site_name: OI Wiki
site_description: OI Wiki is a competitive-programming knowledge base that provides interesting and practical competitive-programming knowledge and other helpful content, helping competitive-programming enthusiasts learn faster and in greater depth.
site_author: OI Wiki Team
site_url: https://madamadam-c.github.io/oiwiki-english/
