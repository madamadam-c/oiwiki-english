name: Deploy Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: yarn

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node dependencies
        run: yarn --frozen-lockfile --production

      - name: Build site
        run: |
          ./scripts/pre-build/pre-build.sh
          uv run mkdocs build -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max_old_space_size=3072

      - name: Post-process HTML
        run: node --loader ts-node/esm scripts/post-build/html-postprocess.ts commits-info math external-links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max_old_space_size=3072

      - name: Minify HTML
        run: ./scripts/post-build/minify-html/minify-html.sh

      - name: Generate redirects
        run: uv run python scripts/post-build/redirect/generate-redirects.py

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
